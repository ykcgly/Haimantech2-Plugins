# 海曼科技院（HaimanTech2 独立版）配置

# version-filter：是否按服务端 MC 版本过滤内容条目与机器配方
#   true（默认，推荐）
#       1) 整条目：严格遵循 register.conditions 的 version 条件（与原版 RSC 行为一致）。
#          同一物品的多版本条目只注册与当前服务端匹配的那一个，不会出现 "ID 冲突" 告警。
#       2) 单条配方：recipe_machines.yml 的 recipes.<n>.version 条件不满足时，该配方直接跳过，
#          不解析材料、不进指南、不参与合成匹配。支持 '>= 1.21.2'、'< 1.21'、
#          '>= 1.20.5, < 1.21'、裸版本号 1.21.2（等价 >=），以及 YAML 列表。
#          MC 26.x 使用 Bukkit.getMinecraftVersion()（26.3）比较，不受 build 号干扰。
#   false
#       忽略所有 version 条件，注册全部条目与全部配方（1.9.11 之前的行为）。
#       此时同一粘液 ID 的多版本条目会互相冲突，跨版本配方也会同时生效（可能引用当前服务端
#       不存在的材质），启动日志会刷出 "ID 冲突" 与材质缺失告警。仅用于debug，勿长期开启。
version-filter: true
